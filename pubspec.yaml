name: inner_shadow
description: >-
  A Flutter package that adds inner shadow support to any widget.
  Supports BorderRadius, multiple shadows, and works with Container,
  Button, Card, or any custom widget. Perfect for neumorphism UI.
version: 0.0.1
#homepage: https://github.com/yourusername/inner_shadow
#repository: https://github.com/yourusername/inner_shadow
#issue_tracker: https://github.com/yourusername/inner_shadow/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

topics:
  - ui
  - shadow
  - neumorphism
  - decoration
  - widget